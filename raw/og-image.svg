<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Source for public/og-image.png. Render with:
     rsvg-convert -w 1200 -h 630 raw/og-image.svg -o public/og-image.png
     The card is one real deck card (purple, red and blue solid) in the landscape
     orientation the board uses on wide screens. -->
<svg width="1200" height="630" viewBox="0 0 1200 630" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="paper" width="350" height="350" patternUnits="userSpaceOnUse">
      <image href="texture-light.png" width="350" height="350" />
    </pattern>
    <filter id="card-shadow" x="-15%" y="-20%" width="130%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#f3f3f3" />
  <rect width="1200" height="630" fill="url(#paper)" />

  <rect x="192" y="60" width="816" height="510" rx="44"
        fill="#ffffff" stroke="#7f52c3" stroke-width="10" filter="url(#card-shadow)" />

  <g fill="none" stroke-width="15.3">
    <circle cx="355.2" cy="197.7" r="96.9" stroke="#8256cf" fill="#8256cf" />
    <circle cx="600"   cy="197.7" r="96.9" stroke="#2d9a4e" />
    <circle cx="844.8" cy="197.7" r="96.9" stroke="#e63946" fill="#e63946" />
    <circle cx="355.2" cy="432.3" r="96.9" stroke="#d6459b" />
    <circle cx="600"   cy="432.3" r="96.9" stroke="#2f7fd8" fill="#2f7fd8" />
    <circle cx="844.8" cy="432.3" r="96.9" stroke="#e07a12" />
  </g>
</svg>
