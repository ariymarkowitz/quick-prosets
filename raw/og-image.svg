<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Source for public/og-image.png. Render with:
     rsvg-convert -w 1200 -h 630 raw/og-image.svg -o public/og-image.png
     The card is one real deck card (purple, red and blue solid) in the landscape
     orientation the board uses on wide screens. -->
<svg width="1200" height="630" viewBox="0 0 1200 630" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="paper" width="350" height="350" patternUnits="userSpaceOnUse">
      <image href="texture-light.png" width="350" height="350" />
    </pattern>
    <filter id="card-shadow" x="-15%" y="-20%" width="130%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#f3f3f3" />
  <rect width="1200" height="630" fill="url(#paper)" />

  <g transform="rotate(180 600 315)">
    <rect x="238.25" y="60" width="723.5" height="510" rx="39"
          fill="#ffffff" stroke="#7f52c3" stroke-width="9" filter="url(#card-shadow)" />

    <!-- Open dots carry the same styling as .dot.open (app.css): a 15%-opacity
         tint fill, then the whole dot faded to 25% opacity on top. -->
    <g stroke-width="11.86">
      <circle cx="386.5" cy="208.3" r="59.3" stroke="#845dc8" fill="#845dc8" />
      <circle cx="600"   cy="208.3" r="59.3" stroke="#2d9a4e" fill="#2d9a4e" fill-opacity="0.15" opacity="0.25" />
      <circle cx="813.5" cy="208.3" r="59.3" stroke="#e63946" fill="#e63946" />
      <circle cx="386.5" cy="421.7" r="59.3" stroke="#d6459b" fill="#d6459b" fill-opacity="0.15" opacity="0.25" />
      <circle cx="600"   cy="421.7" r="59.3" stroke="#2f7fd8" fill="#2f7fd8" />
      <circle cx="813.5" cy="421.7" r="59.3" stroke="#e47503" fill="#e47503" fill-opacity="0.15" opacity="0.25" />
    </g>
  </g>
</svg>
